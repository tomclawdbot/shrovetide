<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1f12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shrovetide" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>Shrovetide</title>
    <style>
      :root {
        --pad-t: env(safe-area-inset-top, 0px);
        --pad-r: env(safe-area-inset-right, 0px);
        --pad-b: env(safe-area-inset-bottom, 0px);
        --pad-l: env(safe-area-inset-left, 0px);
        --ink: #f3ead4;
        --dusk: #140e0a;
        --moss: #0d1f12;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--moss);
        overflow: hidden;
        width: 100%;
        height: 100%;
        height: 100dvh;
        font-family: Palatino, "Palatino Linotype", Georgia, serif;
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game,
      #shell,
      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        display: block;
      }
      #game canvas {
        touch-action: none;
        display: block;
      }
      #safe-probe {
        pointer-events: none;
        visibility: hidden;
        padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
      }
      #shell {
        pointer-events: none;
        z-index: 20;
      }
      #touch-layer {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr) auto;
        padding: 8px calc(12px + env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
        column-gap: 8px;
        row-gap: 6px;
        box-sizing: border-box;
        pointer-events: none;
      }
      #touch-layer[hidden] {
        display: none !important;
      }
      /* Shares the visualViewport shell with stick/Whistle/Kick. Grid row 1
         cannot paint over the control row, so Chrome iOS captions never cover Whistle. */
      #caption-rail {
        grid-column: 1 / -1;
        grid-row: 1;
        justify-self: center;
        align-self: start;
        max-width: min(560px, 72vw);
        pointer-events: auto;
        color: var(--ink);
        background: rgba(20, 14, 10, 0.82);
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.25;
        text-align: center;
        z-index: 2;
      }
      #touch-layer[data-flow="playing"] #caption-rail {
        margin-top: 48px;
      }
      #caption-rail[hidden] {
        display: none !important;
      }
      #caption-pips {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 6px;
      }
      #caption-pips[hidden] {
        display: none !important;
      }
      #caption-pips i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid #f3ead4;
        background: rgba(20, 14, 10, 0.4);
        box-sizing: border-box;
      }
      #caption-pips i.filled {
        background: #e4d4a8;
      }
      .stick-well {
        grid-column: 1;
        grid-row: 3;
        position: relative;
        left: auto;
        right: auto;
        top: auto;
        bottom: auto;
        justify-self: start;
        align-self: end;
        width: 132px;
        height: 132px;
        pointer-events: auto;
        touch-action: none;
      }
      .stick-base,
      .stick-knob {
        position: absolute;
        border-radius: 50%;
        box-sizing: border-box;
      }
      .stick-base {
        inset: 10px;
        background: rgba(20, 14, 10, 0.45);
        border: 2px solid rgba(243, 234, 212, 0.45);
      }
      .stick-knob {
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        background: rgba(243, 234, 212, 0.88);
        border: 2px solid #1a140c;
        will-change: transform;
      }
      .pad-btn {
        position: relative;
        pointer-events: auto;
        touch-action: none;
        color: var(--dusk);
        background: #e4d4a8;
        border: 2px solid #1a140c;
        font-family: inherit;
        font-size: 18px;
        letter-spacing: 0.04em;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
      }
      .pad-btn[hidden] {
        display: none !important;
      }
      .pad-btn:active,
      .pad-btn.held {
        background: #c4a35a;
      }
      #wrestle-btn.held,
      #wrestle-btn.charging {
        box-shadow: 0 0 0 3px rgba(228, 212, 168, calc(0.28 + var(--wrestle-pressure, 0) * 0.6));
      }
      /* Right action cluster: Sprint sits above Kick. Wriggle/Rip appears
         to the left of Kick only when the sim says the hold is live. */
      #right-pads {
        grid-column: 3;
        grid-row: 3;
        justify-self: end;
        align-self: end;
        display: grid;
        grid-template-columns: auto auto;
        grid-template-rows: auto auto;
        gap: 8px;
        align-items: end;
        justify-items: end;
        pointer-events: none;
      }
      #right-pads .pad-btn {
        pointer-events: auto;
      }
      #kick-btn {
        grid-column: 2;
        grid-row: 2;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        font-size: 20px;
      }
      #sprint-btn {
        grid-column: 2;
        grid-row: 1;
        min-width: 92px;
        height: 44px;
        border-radius: 22px;
        font-size: 16px;
        padding: 0 16px;
      }
      #wrestle-btn {
        grid-column: 1;
        grid-row: 2;
        min-width: 88px;
        height: 52px;
        border-radius: 26px;
        font-size: 16px;
        padding: 0 14px;
        align-self: center;
      }
      #follow-btn {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        align-self: start;
        min-width: 84px;
        height: 36px;
        border-radius: 18px;
        font-size: 16px;
        padding: 0 14px;
        background: #e4d4a8;
        color: var(--dusk);
        z-index: 3;
      }
      #switch-btn {
        grid-column: 3;
        grid-row: 2;
        justify-self: end;
        align-self: end;
        min-width: 84px;
        height: 40px;
        border-radius: 20px;
        font-size: 16px;
        padding: 0 14px;
        background: rgba(20, 14, 10, 0.72);
        color: var(--ink);
        border-color: rgba(243, 234, 212, 0.55);
      }
      #ready-btn,
      #goal-btn {
        grid-column: 2;
        grid-row: 3;
        justify-self: center;
        align-self: end;
        transform: none;
        min-width: 168px;
        height: 48px;
        border-radius: 24px;
        font-size: 20px;
        padding: 0 22px;
      }
      #goal-btn.at-stone {
        min-width: 176px;
        height: 56px;
        font-size: 22px;
        background: #e4d4a8;
        box-shadow: 0 0 0 3px rgba(243, 234, 212, 0.55);
      }
      @media (max-height: 320px) {
        .stick-well {
          width: 104px;
          height: 104px;
        }
        #kick-btn {
          width: 88px;
          height: 88px;
          font-size: 18px;
        }
        #sprint-btn {
          min-width: 76px;
          height: 36px;
          font-size: 14px;
        }
        #wrestle-btn {
          min-width: 72px;
          height: 40px;
          font-size: 14px;
        }
        #ready-btn,
        #goal-btn {
          min-width: 140px;
          height: 40px;
          font-size: 18px;
        }
        #goal-btn.at-stone {
          min-width: 148px;
          height: 44px;
        }
        #touch-layer[data-flow="playing"] #caption-rail {
          margin-top: 36px;
        }
      }
      #unmute-btn {
        position: absolute;
        top: 10px;
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        pointer-events: auto;
        touch-action: manipulation;
        color: var(--dusk);
        background: #e4d4a8;
        border: 2px solid #1a140c;
        border-radius: 20px;
        font-family: inherit;
        font-size: 16px;
        padding: 6px 16px;
        z-index: 25;
      }
      #unmute-btn[hidden] {
        display: none !important;
      }
      #rotate-hint {
        display: none;
        position: absolute;
        inset: 0;
        background: var(--moss);
        color: var(--ink);
        pointer-events: auto;
        z-index: 40;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-size: 28px;
        line-height: 1.35;
      }
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate-hint {
          display: flex;
        }
        #touch-layer {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="safe-probe" aria-hidden="true"></div>
    <div id="game"></div>
    <div id="shell">
      <div id="rotate-hint">Turn the phone sideways<br />to run</div>
      <button id="unmute-btn" type="button" hidden>Tap for sound</button>
      <div id="touch-layer" hidden data-flow="title">
        <div id="caption-rail" hidden>
          <div id="caption-text"></div>
          <div id="caption-pips" hidden><i></i><i></i><i></i></div>
        </div>
        <div id="stick-well" class="stick-well">
          <div class="stick-base"></div>
          <div id="stick-knob" class="stick-knob"></div>
        </div>
        <div id="right-pads">
          <button id="sprint-btn" class="pad-btn" type="button" hidden>Sprint</button>
          <button id="wrestle-btn" class="pad-btn" type="button" hidden>Rip</button>
          <button id="kick-btn" class="pad-btn" type="button">Kick</button>
        </div>
        <button id="switch-btn" class="pad-btn" type="button">Switch</button>
        <button id="follow-btn" class="pad-btn" type="button" hidden>Follow</button>
        <button id="ready-btn" class="pad-btn" type="button">Whistle</button>
        <button id="goal-btn" class="pad-btn" type="button" hidden>Goal</button>
      </div>
    </div>
    <script type="module" src="/client/index.ts"></script>
  </body>
</html>
